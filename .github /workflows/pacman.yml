name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta todos los días a medianoche
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Generate Pacman
        uses: abhisheknaiidu/pacman-contribution-graph@main
        with:
          github_user_name: veqzzzz
          # Aquí puedes personalizar colores si quieres
          # games: 'pacman,breakout'
      - name: Push to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
