name: Generate GitHub Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate Trophy
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: veqzzzz
          theme: dracula
          column: -1
          row: 1
          margin-w: 8
          margin-h: 8
          no-bg: false
          no-frame: false
      - name: Push to trophy-output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
